services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homeoclinic
      POSTGRES_USER: clinic_app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - clinic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_app -d homeoclinic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clinic-postgres: